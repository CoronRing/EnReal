name: Pages

# Publishes the static game, with the in-browser engine built from this commit, to
# GitHub Pages at https://coronring.github.io/EnReal/. No server is involved.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - uses: actions/configure-pages@v6
      - name: Build the site and the engine wheel
        # The build script needs only the standard library and uv.
        run: uv run --no-project python scripts/build_web.py --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
