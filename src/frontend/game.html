<!-- app/static/game.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EnReal Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #eee; }
    #container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }
    #hud { padding: 8px 12px; font-family: system-ui, Arial, sans-serif; font-size: 14px; color: #ddd; }
    #game-root { position: relative; flex: 1 1 auto; width: 100%; height: calc(100vh - 44px); }
    .note { color: #aaa; font-size: 12px; }
  </style>
</head>
<body>
  <div id="container">
    <div id="hud">
      Controls: A/D to move, W or Space to jump. S to drop-through. Shift to sprint. J to fire/interact. K bomb. G grenade. H paint. 
      <span class="note">VN intro plays first if available.</span>
    </div>
    <div id="game-root"></div>
  </div>

  <!-- Reusable VN overlay engine -->
  <script src="vn_player.js?v=20251026"></script>
  <!-- Phaser 3 (Matter) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
  <!-- Your platformer -->
  <script src="game.js?v=20251026_full"></script>
</body>
</html>
